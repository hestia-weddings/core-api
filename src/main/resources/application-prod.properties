spring.application.name=core-api
server.port=8081
server.servlet.context-path=/api/v2
server.error.include-stacktrace=never
spring.config.import=optional:file:.env.prod[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

supabase.jwt.issuer=https://${SUPABASE_PROJECT_ID}.supabase.co/auth/v1
supabase.jwt.jwk-set-uri=https://${SUPABASE_PROJECT_ID}.supabase.co/auth/v1/.well-known/jwks.json

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0
