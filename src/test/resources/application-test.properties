server.port=8088

# =========================
# H2 DATABASE
# =========================
spring.datasource.url=jdbc:h2:mem:coreapi;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# =========================
# FLYWAY
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jackson.property-naming-strategy=SNAKE_CASE

# =========================
# H2 CONSOLE
# =========================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================
# SECURITY (mocked in tests)
# =========================
supabase.jwt.issuer=http://localhost
supabase.jwt.jwk-set-uri=http://localhost/.well-known/jwks.json

# =========================
# LOGGING (suppress noise)
# =========================
logging.level.root=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=WARN
logging.level.com.zaxxer.hikari=WARN
spring.main.banner-mode=off
